#? Preprocessing
# * Order matters

preprocessing_individual: [cherry_pick_indices] # FIXME
preprocessing_batch: [amplitude_log10]
# preprocessing_difference_batch: [augment_amplitude]
preprocessing_difference_batch: [
        permutate_blocks,
        mask_blocks_non_episodic,
        # permute_within_blocks,
        augment_amplitude,
    ]
# preprocessing_difference_batch: [mask_blocks_non_episodic, augment_amplitude]

#? Preprocessing additional arguments
num_blocks_to_mask: 1 # Only `mask_blocks_non_episodic`
amplitude_augment_low: 0.5
amplitude_augment_high: 1.5
# amplitude_augment_low: 0.8
# amplitude_augment_high: 1.2
# Frequency cherry picking
# gear_harmonics_to_include: 10 # XXX
gear_harmonics_to_include: 8
gear_sideband_block_size: 5
# gear_sideband_block_size: 7 # !!!

#? Model

model: embedding

loss: triplet
loss_args:
    # margin: 2.0
    margin: 1.4
    miner: True
    miner_type: all
similarity: euclidean
lpnorm_embeddings_training: false
center_embeddings_inference: false
lpnorm_embeddings_inference: false

# ? Remember to set intermediate_L2 to True in the model_args
# loss: supcon
# loss_args:
#     temperature: 0.08
# similarity: cosine # Default: cosine
# lpnorm_embeddings_training: True # Default: True
# center_embeddings_inference: True
# lpnorm_embeddings_inference: True # Default: True

embedding_len: 2
backbone: MlpMixer
model_args:
    intermediate_L2: false
    num_layers: 3
    hidden_dim: 32
    tokens_mlp_dim: 16
    channels_mlp_dim: 64
    # hidden_dim: 21
    # tokens_mlp_dim: 16
    # channels_mlp_dim: 42

# ? Training

episodes_per_dataset_per_batch: 2 # FIXME: Automatically use number of datasets in training
max_batches: 901 # XXX
# max_batches: 1501
# max_batches: 501
# warmup_batches: 0 # XXX
warmup_batches: 100
lr: 0.001
# sch_gamma: 0.999 # XXX
sch_gamma: 0.998
momentum: 0.9
b2: 0.999
gradient_clip: 0 # XXX
# gradient_clip: 0.025 # HERE: Run results XXX: Maybe this is the one?
# gradient_clip: 2.5 

# Regularization
weight_decay: 0.0001
dropout: 0.1
# dropout: 0.3
